---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  values:
    controllers:
      mosquitto:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          hash-passwords:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22
            command:
              - /bin/sh
              - -c
              - cp /secret/passwd /passwd/passwd && mosquitto_passwd -U /passwd/passwd
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22
            env:
              TZ: Europe/Paris
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: mosquitto
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.42.72
        externalTrafficPolicy: Local
        ports:
          mqtt:
            port: 1883
    configMaps:
      config:
        data:
          mosquitto.conf: |
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            password_file /mosquitto/passwd/passwd
            persistence true
            persistence_location /data
    persistence:
      data:
        existingClaim: mosquitto
        advancedMounts:
          mosquitto:
            app:
              - path: /data
      config-file:
        type: configMap
        identifier: config
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
      secret:
        type: secret
        name: mosquitto-secret
        advancedMounts:
          mosquitto:
            hash-passwords:
              - path: /secret
      passwd:
        type: emptyDir
        advancedMounts:
          mosquitto:
            hash-passwords:
              - path: /passwd
            app:
              - path: /mosquitto/passwd
