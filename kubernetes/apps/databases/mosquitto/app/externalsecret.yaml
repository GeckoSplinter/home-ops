---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
  namespace: databases
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mosquitto-secret
    template:
      engineVersion: v2
      data:
        # Plain text, hashed by the hash-passwords init container
        passwd: "{{ .MOSQUITTO_USERNAME }}:{{ .MOSQUITTO_PASSWORD }}"
  dataFrom:
    - extract:
        key: mosquitto
