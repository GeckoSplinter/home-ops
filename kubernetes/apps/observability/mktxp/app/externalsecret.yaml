---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp
  namespace: observability
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mktxp-secret
    template:
      engineVersion: v2
      data:
        # Router credentials, referenced from mktxp.conf via credentials_file
        credentials.yaml: |
          username: "{{ .MKTXP_USER }}"
          password: "{{ .MKTXP_PASSWORD }}"
        # Router definitions; [default] mirrors the full upstream template so mktxp
        # never tries to rewrite the read-only config (missing keys default to enabled = False)
        mktxp.conf: |
          [gateway]
              hostname = 192.168.42.1
              port = 8728
              credentials_file = credentials.yaml
              enabled = True
              custom_labels = role:gateway

          [default]
              hostname = localhost
              username = username
              password = password
              credentials_file = credentials.yaml
              custom_labels = None
              enabled = True
              module_only = False
              probe_allowed_targets = None
              port = 8728
              use_ssl = False
              no_ssl_certificate = False
              ssl_certificate_verify = False
              ssl_check_hostname = True
              ssl_ca_file = ""
              plaintext_login = True
              health = True
              installed_packages = True
              dhcp = True
              dhcp_lease = True
              connections = True
              connection_stats = False
              connection_stats_destinations = False
              interface = True
              interface_with_default_name = False
              routerboard = True
              wireguard_peers = True
              bridge_vlan = False
              route = True
              pool = True
              firewall = True
              neighbor = True
              address_list = None
              address_list_entries = True
              total_address_list_counts = True
              dns = True
              ipv6_route = False
              ipv6_pool = False
              ipv6_firewall = True
              ipv6_neighbor = False
              ipv6_address_list = public-ipv6
              ipv6_address_list_entries = True
              ipv6_total_address_list_counts = True
              poe = False
              monitor = True
              netwatch = True
              public_ip = True
              wireless = True
              wireless_clients = True
              capsman = True
              capsman_clients = True
              w60g = False
              eoip = False
              gre = False
              ipip = False
              lte = False
              ipsec = False
              switch_port = False
              kid_control_assigned = False
              kid_control_dynamic = False
              user = True
              queue = True
              bfd = False
              bgp = False
              routing_stats = False
              certificate = False
              container = False
              remote_dhcp_entry = None
              remote_capsman_entry = None
              interface_name_format = name
              check_for_updates = True
              rsc_ssh_port = None
              rsc_ssh_user = None
        # Exporter daemon settings
        _mktxp.conf: |
          [MKTXP]
              listen = '0.0.0.0:49090'
              socket_timeout = 5
              initial_delay_on_failure = 120
              max_delay_on_failure = 900
              delay_inc_div = 5
              bandwidth = False
              bandwidth_test_dns_server = 8.8.8.8
              bandwidth_test_interval = 600
              minimal_collect_interval = 5
              verbose_mode = False
              fetch_routers_in_parallel = False
              max_worker_threads = 5
              max_scrape_duration = 30
              total_max_scrape_duration = 90
              http_server_threads = 16
              persistent_router_connection_pool = True
              persistent_dhcp_cache = True
              compact_default_conf_values = False
              prometheus_headers_deduplication = False
              probe_connection_pool = False
              probe_connection_pool_ttl = 300
              probe_connection_pool_max_size = 128
              enable_probe = False
              probe_allowed_targets = None
  dataFrom:
    - extract:
        key: mikrotik-exporter
