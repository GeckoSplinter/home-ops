---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp
  namespace: observability
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mktxp-secret
    template:
      engineVersion: v2
      data:
        # Router credentials, referenced from mktxp.conf via credentials_file
        credentials.yaml: |
          username: "{{ .MKTXP_USER }}"
          password: "{{ .MKTXP_PASSWORD }}"
        # Router definitions and collectors (unlisted keys use mktxp defaults)
        mktxp.conf: |
          [gateway]
              hostname = 192.168.42.1
              port = 8728
              credentials_file = credentials.yaml
              custom_labels = role:gateway

          [default]
              routerboard = True
              dns = True
              wireguard_peers = True
              check_for_updates = True
        # Exporter daemon settings
        _mktxp.conf: |
          [MKTXP]
              listen = '0.0.0.0:49090'
              socket_timeout = 5
              initial_delay_on_failure = 120
              max_delay_on_failure = 900
              delay_inc_div = 5
              bandwidth = False
              bandwidth_test_dns_server = 8.8.8.8
              bandwidth_test_interval = 600
              minimal_collect_interval = 5
              verbose_mode = False
              fetch_routers_in_parallel = False
              max_worker_threads = 5
              max_scrape_duration = 30
              total_max_scrape_duration = 90
              http_server_threads = 16
              persistent_router_connection_pool = True
              persistent_dhcp_cache = True
              compact_default_conf_values = False
              prometheus_headers_deduplication = False
              probe_connection_pool = False
              probe_connection_pool_ttl = 300
              probe_connection_pool_max_size = 128
              enable_probe = False
              probe_allowed_targets = None
  dataFrom:
    - extract:
        key: mikrotik-exporter
