machine:
  disks:
      # Selected by stable by-id path (2TB Lexar, serial NDH562R005956P1112),
      # not /dev/nvme1n1: NVMe device node names aren't stable across
      # reboots on this host and previously matched the wrong physical disk
      # after a kernel/driver enumeration change.
      - device: /dev/disk/by-id/nvme-eui.0000000623032562caf25b032b000100
        partitions:
          - mountpoint: /var/mnt/nvme-2000
