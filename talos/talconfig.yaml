# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: "home-ops"

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.42.32:6443
additionalApiServerCertSans: &sans
  - "192.168.42.32"
  - 127.0.0.1 # KubePrism
  - "kube-api.home.gecko.ninja"
  - "k8s.gecko.ninja"
additionalMachineCertSans: *sans

clusterPodNets: ["10.69.0.0/16"]
clusterSvcNets: [ "10.96.0.0/16"]

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "k8s-bee-s1"
    ipAddress: "192.168.42.33"
    # By-id path, not /dev/nvme0n1: NVMe device node names aren't stable
    # across reboots and can be reassigned by kernel/driver enumeration order.
    installDisk: "/dev/disk/by-id/nvme-CT500P3PSSD8_2251E69538D8"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "b0:41:6f:0a:b5:09"
        dhcp: false
        addresses:
          - "192.168.42.33/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.42.1"
        mtu: 1500
        vip:
          ip: "192.168.42.32"
    patches:
      - "@./patches/k8s-bee-s1/disks.yaml"
  - hostname: "k8s-bee-s2"
    ipAddress: "192.168.42.34"
    # By-id path, not /dev/nvme0n1: this host's two NVMe drives were
    # previously mismapped after a reboot changed enumeration order, so the
    # raw device name is untrustworthy here. This is the 500GB Crucial that
    # actually holds the STATE/EPHEMERAL/META partitions.
    installDisk: "/dev/disk/by-id/nvme-CT500P3PSSD8_241147842B6F"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "b0:41:6f:13:98:91"
        dhcp: false
        addresses:
          - "192.168.42.34/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.42.1"
        mtu: 1500
        vip:
          ip: "192.168.42.32"
    patches:
      - "@./patches/k8s-bee-s2/disks.yaml"
  - hostname: "k8s-min-s3"
    ipAddress: "192.168.42.35"
    # By-id path, not /dev/nvme0n1: NVMe device node names aren't stable
    # across reboots and can be reassigned by kernel/driver enumeration order.
    installDisk: "/dev/disk/by-id/nvme-KINGSTON_OM8PDP3512B-A01_50026B7685BA809E"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "1c:83:41:29:c2:02"
        dhcp: false
        addresses:
          - "192.168.42.35/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.42.1"
        mtu: 1500
        vip:
          ip: "192.168.42.32"
    patches:
      - "@./patches/k8s-min-s3/disks.yaml"

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
